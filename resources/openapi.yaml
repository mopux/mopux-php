        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/summary:
    get:
      operationId: projectsSummary
      tags: [Projects]
      summary: Resumen del proyecto
      description: Progreso, distribución de cada grupo por estado y carga de trabajo por persona, igual que la página de resumen de la web.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Resumen recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project: { type: object, properties: { id: { type: integer }, title: { type: string } } }
                          total: { type: integer }
                          completed: { type: integer }
                          pending: { type: integer }
                          progress: { type: integer, description: Porcentaje de tareas hechas }
                          groups:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string }
                                status: { type: integer, description: '0 activo, 1 archivado' }
                                total: { type: integer }
                                progress: { type: integer }
                                counts:
                                  type: object
                                  properties:
                                    pending: { type: integer }
                                    doing: { type: integer }
                                    revision: { type: integer }
                                    done: { type: integer }
                                    delayed: { type: integer }
                          people:
                            type: array
                            items:
                              type: object
                              properties:
                                user: { type: object, properties: { id: { type: integer }, name: { type: string }, avatar: { type: [string, 'null'] } } }
                                total: { type: integer }
                                pending: { type: integer }
                                completed: { type: integer }
                          unassigned: { type: object, properties: { total: { type: integer }, pending: { type: integer }, completed: { type: integer } } }
                          without_tasks: { type: integer, description: Miembros sin tareas asignadas }
                          multiple_assignees: { type: boolean }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/board:
    get:
      operationId: projectsBoard
      tags: [Projects]
      summary: Kanban del proyecto (grupos y tareas)
      description: Todos los grupos con sus tareas **abiertas** (las hechas no se incluyen). Con `search` o filtros solo aparecen los grupos que tienen alguna tarea que coincide.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: archived
          description: '1 (por defecto) incluye los grupos archivados; 0 devuelve solo los activos.'
          schema:
            type: integer
            enum: [0, 1]
            default: 1
        - in: query
          name: search
          description: Texto a buscar en el título de las tareas.
          schema:
            type: [string, 'null']
            maxLength: 255
        - in: query
          name: params
          description: 'Filtros por IDs de usuario, estados y prioridades. Se envía como array en la query (`params[users][]=5&params[status][]=1`) o como JSON serializado.'
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              users: { type: array, items: { type: integer } }
              status: { type: array, items: { type: integer } }
              priority: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Board recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectBoard'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/task-groups/reorder:
    patch:
      operationId: taskGroupsReorder
      tags: [Projects]
      summary: Reordenar grupos de tareas de un proyecto
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups:
                  type: array
                  minItems: 1
                  description: Sin IDs repetidos (422 si se repite alguno o no pertenece al proyecto).
                  items:
                    type: object
                    required: [value, order]
                    properties:
                      value:
                        type: integer
                        description: ID de task group
                      order:
                        type: integer
                        minimum: 0
            examples:
              reorder:
                value:
                  groups:
                    - value: 11
                      order: 2
                    - value: 12
                      order: 1
      responses:
        '200':
          description: Grupos reordenados
          content:
            application/json:
              schema:
                allOf:
