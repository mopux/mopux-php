        updated_at: { type: [string, 'null'] }

    CommentStoreJsonBody:
      type: object
      description: Hace falta al menos uno de `comment`, `mentions` o `media_ids`.
      properties:
        comment:
          type: [string, 'null']
          maxLength: 65535
        mentions:
          type: array
          items:
            type: integer
        media_ids:
          type: array
          items:
            type: integer

    CommentStoreMultipartBody:
      type: object
      description: 'Los arrays se envían con una parte por elemento y nombre con corchetes: `files[]`, `mentions[]`, `media_ids[]`.'
      properties:
        comment:
          type: [string, 'null']
          maxLength: 65535
        mentions:
          type: array
          items:
            type: integer
        media_ids:
          type: array
          items:
            type: integer
        files:
          type: array
          items:
            type: string
            format: binary

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: [string, 'null']
        message:
          type: [string, 'null']
        route:
          type: [string, 'null']
        karma:
          type: [string, 'null']
        data:
          type: object
          additionalProperties: true
        is_read:
          type: boolean
        read_at:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
        updated_at:
          type: [string, 'null']

    TeamInvitation:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        status:
          type: boolean
        rol:
          type: integer
        hash:
          type: string
        log:
          type: array
          items:
            type: array
            items: {}
        invited_by:
          type: [integer, 'null']
        invited_by_user:
          type: object
          properties:
            id:
              type: [integer, 'null']
            name:
              type: [string, 'null']
            email:
              type: [string, 'null']
        created_at:
          type: [string, 'null']
        updated_at:
          type: [string, 'null']

    PaginatedTeamInvitations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamInvitation'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    AuthTokenData:
      type: object
      properties:
        token_type:
          type: string
