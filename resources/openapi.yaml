        '403': { $ref: '#/components/responses/Error403' }
        '422': { $ref: '#/components/responses/Error422' }

    post:
      tags: [Team Invitations]
      summary: Crear invitación de equipo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, rol]
              properties:
                email: { type: string, format: email }
                rol: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamInvitation' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/team/invitations/{invitationId}/resend:
    post:
      tags: [Team Invitations]
      summary: Reenviar invitación de equipo
      parameters:
        - $ref: '#/components/parameters/invitationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamInvitation' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/v1/team/invitations/{invitationId}:
    delete:
      tags: [Team Invitations]
      summary: Eliminar invitación de equipo
      parameters:
        - $ref: '#/components/parameters/invitationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    taskId:
      in: path
      name: taskId
      required: true
      schema: { type: integer }
    projectId:
      in: path
      name: projectId
      required: true
      schema: { type: integer }
    taskGroupId:
      in: path
      name: taskGroupId
      required: true
      schema: { type: integer }
    commentId:
      in: path
      name: commentId
      required: true
      schema: { type: integer }
    notificationId:
      in: path
      name: notificationId
      required: true
      schema: { type: string, format: uuid }
    invitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: integer }

  responses:
    Error401:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            success: false
            message: Unauthenticated.
            data:
              error: Unauthenticated.

    Error403:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    Error404:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            success: false
            message: Resource not found.
            data:
              error: Resource not found.

    UncertainWriteResult:
      description: Resultado incierto. Refresca el estado antes de reintentar; nunca reintentes automáticamente una creación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Error422:
      description: Validation failed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      error: { type: string }
                      errors:
                        type: object
                        additionalProperties:
                          type: array
                          items: { type: string }

  schemas:
    AuthenticatedUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }
        updated_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }
        last_login_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }
        last_login_ip: { type: [string, 'null'] }
        media_id: { type: [integer, 'null'] }
        avatar: { type: [string, 'null'] }

    ActivityUser:
      type: [object, 'null']
      properties:
        id: { type: integer }
        name: { type: string }
        avatar: { type: [string, 'null'] }

    ActivityReference:
      type: [object, 'null']
      properties:
        id: { type: [integer, 'null'] }
        title: { type: [string, 'null'] }

    ProjectActivity:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        description: { type: [string, 'null'], description: Texto sin HTML. }
        actor: { $ref: '#/components/schemas/ActivityUser' }
        affected_user: { $ref: '#/components/schemas/ActivityUser' }
        project: { $ref: '#/components/schemas/ActivityReference' }
        task: { $ref: '#/components/schemas/ActivityReference' }
        group: { $ref: '#/components/schemas/ActivityReference' }
        comment_id: { type: [integer, 'null'] }
        media: { $ref: '#/components/schemas/ActivityReference' }
        changes:
          description: Datos saneados del evento. Puede ser un objeto con los campos presentes o un array vacío cuando no hay cambios.
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                title: {}
                old_status: {}
                status: {}
                tags: {}
                old_hours_expected: {}
                hours_expected: {}
                old_hours_inverted: {}
                hours_inverted: {}
                old_start: {}
                start: {}
                old_end: {}
                end: {}
                old_title: {}
                old_description: {}
                description: {}
                comment: {}
                parent_comment_id: {}
                assignment_set: { type: boolean }
                assigned_ids: { type: array, items: { type: integer } }
                old_assigned_ids: { type: array, items: { type: integer } }
                assigned_names: { type: array, items: { type: string } }
                old_assigned_names: { type: array, items: { type: string } }
                assigned_to: { type: integer, nullable: true }
                old_assigned_to: { type: integer, nullable: true }
                file_count: {}
                old_priority: {}
                priority: {}
            - type: array
              maxItems: 0
              items: {}
        occurred_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }

    PaginatedProjectActivity:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectActivity' }
        links: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }

    ApiSuccess:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string }

    ApiError:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        data:
          type: object
          additionalProperties: true

    UserBrief:
      type: object
      properties:
        id: { type: integer, nullable: true }
        name: { type: string, nullable: true }
        avatar: { type: string, nullable: true }

    TaskSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: integer }
        priority: { type: integer }
        assigned_to: { type: integer, nullable: true }
        comments_count: { type: integer, nullable: true }
        medias_count: { type: integer, nullable: true }
        updated_at: { type: string, nullable: true }

    ProjectSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: integer }
        date_starts: { type: string, nullable: true }
        date_ends: { type: string, nullable: true }
        owner: { $ref: '#/components/schemas/UserBrief' }
        users_count: { type: integer, nullable: true }
        tasks_count: { type: integer, nullable: true }
        done_count: { type: integer, nullable: true }
        updated_at: { type: string, nullable: true }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          properties:
            slug: { type: string, nullable: true }
            type: { type: string, nullable: true }
            configuration:
              type: object
              nullable: true
              additionalProperties: true
            date_finished: { type: string, nullable: true }
            users:
              type: array
              items: { $ref: '#/components/schemas/UserBrief' }
            task_groups_count: { type: integer, nullable: true }
            created_at: { type: string, nullable: true }

    TaskBoard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        priority: { type: integer, nullable: true }
        project_position: { type: integer, nullable: true }
        group_position: { type: integer, nullable: true }
        status_position: { type: integer, nullable: true }
        date_start: { type: string, nullable: true }
