        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/activity:
    get:
      operationId: projectsActivity
      tags: [Projects]
      summary: Consultar la actividad del proyecto
      description: Actividad del proyecto accesible para el usuario, ordenada por fecha e ID descendentes. Los filtros se combinan. La fecha hasta incluye todo el día indicado.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, task_completed, comments, documents, date_start, date_end, task_deleted]
            default: all
        - in: query
          name: type
          description: Tipo exacto del evento.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: user_id
          description: Usuario que realizó la acción.
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Debe ser igual o posterior a from.
          schema: { type: string, format: date }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Actividad recuperada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaginatedProjectActivity' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/members:
    get:
      operationId: projectsMembers
      tags: [Projects]
      summary: Miembros del proyecto
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Miembros recuperados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          members:
                            type: array
                            items: { $ref: '#/components/schemas/ProjectMember' }
