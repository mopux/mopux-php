        '429': { $ref: '#/components/responses/Error429' }
    patch:
      operationId: tasksUpdate
      tags: [Tasks]
      summary: Actualización parcial general de tarea
      description: |
        Actualiza cualquier subconjunto de los campos soportados de una tarea
        existente. El cuerpo no puede estar vacío ni contener campos
        desconocidos. Una omisión conserva el valor actual; null borra
        descripción, fechas u horas. `assignees` es una mutación explícita:
        { operation: add|remove|replace, user_ids: [ids] }. add/remove exigen
        al menos un id; replace con [] deja la tarea sin responsable. Todos los
        ids deben ser miembros del proyecto. La fecha final combinada debe
        cumplir fin >= inicio. Las horas usan HH:MM y se guardan como HH:MM:SS.
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateInput'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TaskDetail' }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }
        '500':
          $ref: '#/components/responses/UncertainWriteResult'

    delete:
      operationId: tasksDelete
      tags: [Tasks]
      summary: Eliminar tarea
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Tarea eliminada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 0
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }

