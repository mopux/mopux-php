  /api/v1/team/invitations:
    get:
      operationId: teamInvitationsList
      tags: [Team Invitations]
      summary: Listar invitaciones de equipo
      description: Requiere permiso para gestionar el equipo.
      parameters:
        - in: query
          name: q
          schema:
            type: [string, 'null']
            maxLength: 255
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, accepted]
            default: all
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Invitaciones recuperadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedTeamInvitations'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }

    post:
      operationId: teamInvitationsCreate
      tags: [Team Invitations]
      summary: Crear invitación de equipo
      description: 'Requiere permiso para gestionar el equipo. `rol` es el ID de un rol existente del guard web; invitar con el rol de administrador devuelve 403. El tipo de usuario (interno o externo) sale del rol. Limitación actual: los errores de negocio (email duplicado, sin plazas libres) y los fallos de permiso responden 422 con el motivo en `data.error`, sin `data.errors`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, rol]
              properties:
                email:
                  type: string
                  format: email
                rol:
                  type: integer
                  description: ID del rol (guard web). No puede ser el rol de administrador.
      responses:
        '200':
          description: Invitación creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamInvitation'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/team/invitations/{invitationId}/resend:
    post:
      operationId: teamInvitationsResend
      tags: [Team Invitations]
      summary: Reenviar invitación de equipo
      description: Requiere permiso para gestionar el equipo; reenviar una invitación con rol de administrador requiere ser administrador. Una invitación ya aceptada devuelve 404.
      parameters:
        - $ref: '#/components/parameters/invitationId'
      responses:
        '200':
          description: Invitación reenviada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamInvitation'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/team/invitations/{invitationId}:
    delete:
      operationId: teamInvitationsDelete
      tags: [Team Invitations]
      summary: Eliminar invitación de equipo
      description: Requiere ser administrador de la instalación. Una invitación ya aceptada devuelve 404.
      parameters:
        - $ref: '#/components/parameters/invitationId'
      responses:
        '200':
          description: Invitación eliminada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 0
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429': { $ref: '#/components/responses/Error429' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    taskId:
      in: path
      name: taskId
      required: true
      schema:
        type: integer
    projectId:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
    taskGroupId:
      in: path
      name: taskGroupId
      required: true
      schema:
        type: integer
    commentId:
      in: path
      name: commentId
      required: true
      schema:
        type: integer
    notificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
        format: uuid
    invitationId:
      in: path
      name: invitationId
      required: true
      schema:
        type: integer

  responses:
    Error401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Unauthenticated.
            data:
              error: Unauthenticated.

    Error403:
      description: 'Prohibido: falta permiso (incluido el permiso de uso de la API), el scope OAuth (`mopux:read` para lecturas, `mopux:write` para escrituras) o el acceso está bloqueado por facturación (en ese caso el cuerpo es `{success: false, message}` sin `data`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: You are not authorized to modify this comment.
            data:
              error: You are not authorized to modify this comment.

    Error404:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Resource not found.
            data:
              error: Resource not found.

    Error429:
      description: Demasiadas peticiones. Espera los segundos indicados en `Retry-After` antes de reintentar; la petición no se ha ejecutado.
      headers:
        Retry-After:
          description: Segundos que hay que esperar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
          example:
            message: Too Many Attempts.

    UncertainWriteResult:
      description: Resultado incierto. Refresca el estado antes de reintentar; nunca reintentes automáticamente una creación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Error422:
      description: Error de validación
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                      errors:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
          example:
            success: false
            message: "The filter must be one of: all, read, unread."
            data:
              error: Validation failed.
              errors:
                filter:
                  - "The filter must be one of: all, read, unread."

  examples:
    LoginSuccess:
      value:
        success: true
        data:
          token_type: Bearer
          token: 1|abc123...
          user:
            id: 1
            name: API User
            email: api-user@mopux.test
        message: User login successfully.
    CommentCreated:
      value:
        success: true
        data:
          id: 55
          parent_id: null
          task_id: 22
          project_id: 3
          comment: Comentario con dos adjuntos
          user:
            id: 1
            name: API User
            avatar: null
          parent: null
          mentions:
            - id: 90
              user_id: 12
              user:
                id: 12
                name: Ana
                avatar: null
          medias:
            - id: 101
              title: one.txt
              type: dwn
              mimetype: text/plain
              url: https://acme.mopux.com/uploads/...
            - id: 102
              title: two.txt
              type: dwn
              mimetype: text/plain
              url: https://acme.mopux.com/uploads/...
          replies_count: 0
          created_at: '2026-02-25 11:00:00'
          updated_at: '2026-02-25 11:00:00'
        message: Comment created successfully.

  schemas:
    AuthenticatedUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }
        updated_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }
        last_login_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }
        last_login_ip: { type: [string, 'null'] }
        media_id: { type: [integer, 'null'] }
        avatar: { type: [string, 'null'] }

    Attachment:
      type: object
      required: [id, size, url, comment_ids, direct]
      properties:
        id: { type: integer }
        title: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        mimetype: { type: [string, 'null'] }
        size: { type: integer, description: Bytes. }
        url: { type: string, description: Enlace de descarga firmado; caduca a los 15 minutos. }
        comment_ids: { type: array, items: { type: integer }, description: Comentarios en los que aparece. }
        direct: { type: boolean, description: Adjuntado directamente a la tarea (no solo a un comentario). }

    FocusList:
      type: object
      required: [tasks, limit]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        limit:
          type: integer
          description: Máximo de tareas fijadas (5).

    ProjectMember:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        avatar: { type: [string, 'null'] }

    TaskGroupCreated:
      type: object
      description: Grupo recién creado (respuesta sin `tasks`).
      required: [id, project_id, title]
      properties:
        id: { type: integer }
        project_id: { type: integer }
        title: { type: string }
        status: { type: [integer, boolean, 'null'], description: 'Actualmente se devuelve `false` (activo) en lugar de 0.' }
        position: { type: [integer, 'null'] }

    ActivityUser:
      type: [object, 'null']
      properties:
        id: { type: integer }
        name: { type: string }
        avatar: { type: [string, 'null'] }

    ActivityReference:
      type: [object, 'null']
      properties:
        id: { type: [integer, 'null'] }
        title: { type: [string, 'null'] }

    ProjectActivity:
      type: object
      properties:
        id: { type: integer }
        type:
          type: string
          description: 'Tipo de evento. Valores actuales: create-task, delete-task, create-group, group-deleted, move-tasks, task-assigned, task-tagging, update-task-status, update-task-title, update-task-description, update-task-priority, update-task-hours, update-task-date-start, update-task-date-end, create-comment, reply-comment, uploaded-file. La lista puede crecer: trata los valores desconocidos como texto.'
        description: { type: [string, 'null'], description: Texto sin HTML. }
        actor: { $ref: '#/components/schemas/ActivityUser' }
        affected_user: { $ref: '#/components/schemas/ActivityUser' }
        project: { $ref: '#/components/schemas/ActivityReference' }
        task: { $ref: '#/components/schemas/ActivityReference' }
        group: { $ref: '#/components/schemas/ActivityReference' }
        comment_id: { type: [integer, 'null'] }
        media: { $ref: '#/components/schemas/ActivityReference' }
        changes:
          description: Datos saneados del evento. Puede ser un objeto con los campos presentes o un array vacío cuando no hay cambios.
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                title: {}
                old_status: {}
                status: {}
                tags: {}
                old_hours_expected: {}
                hours_expected: {}
                old_hours_inverted: {}
                hours_inverted: {}
                old_start: {}
                start: {}
                old_end: {}
                end: {}
                old_title: {}
                old_description: {}
                description: {}
                comment: {}
                parent_comment_id: {}
                assignment_set: { type: boolean }
                assigned_ids: { type: array, items: { type: integer } }
                old_assigned_ids: { type: array, items: { type: integer } }
                assigned_names: { type: array, items: { type: string } }
                old_assigned_names: { type: array, items: { type: string } }
                assigned_to: { type: [integer, 'null'] }
                old_assigned_to: { type: [integer, 'null'] }
                added_ids: { type: array, items: { type: integer } }
                removed_ids: { type: array, items: { type: integer } }
                added_names: { type: array, items: { type: string } }
                removed_names: { type: array, items: { type: string } }
                file_count: {}
                old_priority: {}
                priority: {}
            - type: array
              maxItems: 0
              items: {}
        occurred_at: { type: [string, 'null'], description: 'Formato Y-m-d H:i:s.' }

    PaginatedProjectActivity:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectActivity' }
        links: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }

    ApiSuccess:
      type: object
      required: [success, data, message]
      properties:
        success:
          type: boolean
          const: true
        data: {}
        message:
          type: string

    ApiError:
      type: object
      description: 'Envoltorio de error. `data` está presente en todos los errores salvo el 429 y el 403 por bloqueo de facturación.'
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: object
          properties:
            error:
              type: string
            errors:
              type: object
              description: Solo en 422. Mensajes por campo.
              additionalProperties:
                type: array
                items:
                  type: string
          additionalProperties: true

    UserBrief:
      type: object
      properties:
        id:
          type: [integer, 'null']
        name:
          type: [string, 'null']
        avatar:
          type: [string, 'null']

    ProjectBrief:
      type: object
      properties:
        id:
          type: [integer, 'null']
        title:
          type: [string, 'null']

    GroupBrief:
      type: object
      properties:
        id:
          type: [integer, 'null']
        title:
          type: [string, 'null']

    TaskSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatusRead' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        date_start: { type: [string, 'null'] }
        date_end: { type: [string, 'null'] }
        hours_expected: { type: [string, 'null'] }
        hours_inverted: { type: [string, 'null'] }
        assigned_to: { type: [integer, 'null'] }
        project: { $ref: '#/components/schemas/ProjectBrief' }
        group: { $ref: '#/components/schemas/GroupBrief' }
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
        comments_count: { type: [integer, 'null'] }
        medias_count: { type: [integer, 'null'] }
        updated_at: { type: [string, 'null'] }

    ProjectSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        date_starts: { type: [string, 'null'], description: "'Y-m-d H:i:s'" }
        date_ends: { type: [string, 'null'], description: "'Y-m-d H:i:s'" }
        owner:
          $ref: '#/components/schemas/UserBrief'
        users_count: { type: [integer, 'null'] }
        tasks_count: { type: [integer, 'null'] }
        done_count: { type: [integer, 'null'] }
        updated_at: { type: [string, 'null'] }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          properties:
            slug: { type: [string, 'null'] }
            type: { type: [string, 'null'] }
            configuration:
              type: [object, 'null']
              additionalProperties: true
            date_finished: { type: [string, 'null'] }
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserBrief'
            task_groups_count: { type: [integer, 'null'] }
            created_at: { type: [string, 'null'] }

    TaskBoard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatusRead' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        project_position: { type: [integer, 'null'] }
        group_position: { type: [integer, 'null'] }
        status_position: { type: [integer, 'null'] }
        date_start: { type: [string, 'null'] }
        date_end: { type: [string, 'null'] }
        hours_expected: { type: [string, 'null'] }
        hours_inverted: { type: [string, 'null'] }
        assigned_to: { type: [integer, 'null'] }
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
        comments_count: { type: [integer, 'null'] }
        medias_count: { type: [integer, 'null'] }
        updated_at: { type: [string, 'null'] }

    TaskGroupBoard:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: [integer, 'null'], description: '0 activo, 1 archivado' }
        position: { type: [integer, 'null'] }
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskBoard'

    ProjectBoard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        task_groups:
          type: array
          items:
            $ref: '#/components/schemas/TaskGroupBoard'
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
        updated_at: { type: [string, 'null'] }

    PaginatedProjects:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            tags:
              type: array
              items:
                type: string
            created_at:
              type: [string, 'null']

    ProjectStatus:
      type: integer
      enum: [0, 1, 2, -1]
      description: '0 en curso, 1 terminado, 2 archivado, -1 retrasado. El retrasado lo calcula Mopux: al editar solo se puede mantener si el proyecto ya lo tenía.'

    TaskStatusRead:
      type: integer
      enum: [0, 1, 2, 3, -1]
      description: 'Estado de una tarea en las respuestas: 0 pendiente, 1 en curso, 2 en revisión, 3 hecha, -1 retrasada (solo lectura, no se puede enviar).'

    TaskStatus:
      type: integer
      enum: [0, 1, 2, 3]
      description: '0 pending, 1 in progress, 2 review, 3 done. -1 (delayed) is readable but not writable.'

    TaskPriority:
      type: integer
      enum: [0, 1, 2, 9]
      description: '0 low, 1 normal, 2 high, 9 maximum.'

    AssigneeMutation:
      type: object
      required: [operation, user_ids]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [add, remove, replace]
        user_ids:
          type: array
          items: { type: integer, minimum: 1 }
      description: 'add/remove require at least one id; replace with [] clears all assignments.'

    TaskCreateInput:
      type: object
      description: 'Limitación actual: los campos no documentados se ignoran sin error (actualizar una tarea sí los rechaza con 422).'
      required: [project_id, group_id, title]
      additionalProperties: false
      properties:
        project_id: { type: integer }
        group_id: { type: integer }
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        date_start: { type: [string, 'null'], format: date }
        date_end: { type: [string, 'null'], format: date }
        hours_expected: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$', description: 'HH:MM duration; stored as HH:MM:SS.' }
        hours_inverted: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$', description: 'HH:MM duration; stored as HH:MM:SS.' }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255 }
        assignees:
          type: array
          items: { type: integer, minimum: 1 }
          description: 'Initial set of project member ids; [] means none.'

    TaskUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assignees: { $ref: '#/components/schemas/AssigneeMutation' }
        date_start: { type: [string, 'null'], format: date }
        date_end: { type: [string, 'null'], format: date }
        hours_expected: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$' }
        hours_inverted: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$' }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255 }

    TaskBatchUpdateItem:
      type: object
      required: [id, changes]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 1 }
        changes: { $ref: '#/components/schemas/TaskBatchChanges' }

    TaskBatchChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Los mismos campos que PATCH /api/v1/tasks/{taskId}, más el movimiento a otro grupo (task_group_id) o a otro proyecto (destination_project_id junto con task_group_id).
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assignees: { $ref: '#/components/schemas/AssigneeMutation' }
        date_start: { type: [string, 'null'], format: date }
        date_end: { type: [string, 'null'], format: date }
        hours_expected: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$' }
        hours_inverted: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$' }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255 }
        task_group_id: { type: integer, minimum: 1 }
        destination_project_id: { type: integer, minimum: 1, description: Requiere task_group_id del proyecto de destino }

    TaskBatchUpdateInput:
      type: object
      required: [tasks]
      additionalProperties: false
      properties:
        tasks:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/TaskBatchUpdateItem' }
          description: 'Distinct tasks; they may belong to different projects of the same tenant.'

    TaskGroupCompoundTask:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        date_start: { type: [string, 'null'], format: date }
        date_end: { type: [string, 'null'], format: date }
        hours_expected: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$' }
        hours_inverted: { type: [string, 'null'], pattern: '^[0-9]{1,2}:[0-5][0-9]$' }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255 }
        assignees:
          type: array
          items: { type: integer, minimum: 1 }
          description: 'Initial set of project member ids; [] means none.'

    CommentMedia:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        title: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        mimetype: { type: [string, 'null'] }
        url: { type: [string, 'null'] }

    CommentMention:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        user:
          $ref: '#/components/schemas/UserBrief'

    CommentParent:
      type: [object, 'null']
      properties:
        id: { type: integer }
        comment: { type: string }
        user:
          $ref: '#/components/schemas/UserBrief'

    Touch:
      type: object
      required: [id, sender_id, recipient_id, task_id, status, sender, recipient]
      properties:
        id: { type: integer }
        sender_id: { type: integer }
        recipient_id: { type: integer }
        task_id: { type: integer }
        sender_message: { type: [string, 'null'] }
        recipient_message: { type: [string, 'null'] }
        status: { type: string, enum: [pending, answered] }
        sender: { $ref: '#/components/schemas/TouchUser' }
        recipient: { $ref: '#/components/schemas/TouchUser' }
        created_at: { type: [string, 'null'], description: "'Y-m-d H:i:s'" }
        updated_at: { type: [string, 'null'], description: "'Y-m-d H:i:s'" }

    TouchUser:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        name: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }

    Comment:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        task_id: { type: integer }
        project_id: { type: integer }
        comment: { type: string }
        user:
          $ref: '#/components/schemas/UserBrief'
        parent:
          $ref: '#/components/schemas/CommentParent'
        mentions:
          type: array
