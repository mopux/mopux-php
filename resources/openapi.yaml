            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Miembro añadido; devuelve el equipo actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          members:
                            type: array
                            items: { $ref: '#/components/schemas/ProjectMember' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/members/{userId}:
    delete:
      operationId: projectsRemoveMember
      tags: [Projects]
      summary: Quitar un miembro del proyecto
      description: 'Requiere poder gestionar el proyecto. No se puede quitar al propietario ni a uno mismo (422). Las tareas del miembro siguen en el proyecto. Quitar a alguien que no es miembro no hace nada y devuelve 200. Limitación actual: si el proyecto tiene algún miembro desactivado, la operación devuelve 422 (`errors.members`).'
