      description: 'Hace falta texto, ficheros, `media_ids` o menciones. Las menciones a usuarios que no son miembros del proyecto se ignoran. En multipart los arrays van como `files[]`, `mentions[]` y `media_ids[]`. Limitación actual: los fallos de permisos (crear comentarios, subir ficheros) responden 422 en lugar de 403.'
