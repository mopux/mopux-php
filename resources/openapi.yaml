      description: Las mismas personas que muestra la página de equipo. Los administradores y quienes gestionan el equipo ven a todo el mundo; el resto, con projects.view, solo a quienes comparten proyecto con ellos.
      parameters:
        - in: query
          name: search
          description: Nombre o email
          schema: { type: string, maxLength: 255 }
        - in: query
          name: role
          description: Nombre del rol, o __none__ para personas sin rol
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Equipo recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          members:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                name: { type: string }
                                email: { type: string }
                                avatar: { type: string, nullable: true }
                                is_active: { type: boolean }
                                roles: { type: array, items: { type: string } }
                          page: { type: integer }
                          last_page: { type: integer }
                          total: { type: integer }
