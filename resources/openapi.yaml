        - in: query
          name: status
          schema: { type: string, enum: [all, pending, accepted], default: all }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
