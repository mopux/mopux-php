                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_groups:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string }
                                position: { type: integer }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
