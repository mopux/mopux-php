        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}/task-groups:
    post:
      operationId: taskGroupsCreate
      tags: [Projects]
      summary: Crear grupo de tareas en un proyecto
      description: |
        Si se omite `tasks` se crea solo el grupo (respuesta heredada). Si se
        incluye `tasks` (1 a 4) se crean el grupo y sus tareas en una única
        operación atómica; las tareas heredan el proyecto y el grupo y no
        pueden indicar otro destino. Ante cualquier fallo no se crea nada.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 255 }
                tasks:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { $ref: '#/components/schemas/TaskGroupCompoundTask' }
      responses:
        '200':
          description: Grupo de tareas creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/TaskGroupCreated'
                          - type: object
                            description: Respuesta cuando se envía `tasks`.
                            required: [group, tasks]
                            properties:
                              group: { $ref: '#/components/schemas/TaskGroupCreated' }
                              tasks:
                                type: array
                                items: { $ref: '#/components/schemas/TaskDetail' }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }
        '500':
          $ref: '#/components/responses/UncertainWriteResult'

