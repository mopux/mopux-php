        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }
    post:
      operationId: projectsAddMember
      tags: [Projects]
      summary: Añadir un miembro al proyecto
      description: 'Requiere poder gestionar el proyecto. El usuario debe existir y estar activo. Devuelve el equipo actualizado. Limitación actual: si el proyecto tiene algún miembro desactivado, la operación devuelve 422 (`errors.members`).'
      parameters:
        - $ref: '#/components/parameters/projectId'
