openapi: 3.1.0
info:
  title: Mopux Public API v1
  version: 1.1.0
  description: |
    Versión pública y simplificada de la API v1 de Mopux.

    Reglas generales:
    - Base path: `/api/v1`
    - Auth: Bearer token (Sanctum u OAuth cuando está habilitado)
    - OAuth requiere mopux:read para lecturas y mopux:write para escrituras (logout no requiere scope).
    - Errores unificados: `success`, `message`, `data`

    Resultado incierto y reintentos:
    - Las operaciones enriquecidas (`POST /api/v1/tasks`, `PATCH /api/v1/tasks/{taskId}`, `PATCH /api/v1/tasks/batch`, `POST /api/v1/projects/{projectId}/task-groups` con `tasks`) son atómicas: 404 recurso ausente, 403/422 inválido; ante esos errores conocidos no se aplica nada.
    - Ante un 500 inesperado el resultado es incierto: no se garantiza que no se haya escrito. No reintentes automáticamente una creación; refresca el estado antes de decidir. No hay idempotencia persistida para crear tareas.
    - Las horas se envían como `HH:MM` y se devuelven como `HH:MM:SS`; `null` borra descripción, fechas u horas; `assignees` es `{operation, user_ids}`; `status` `-1` es de solo lectura.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: mopux.web-mopux-2025.test

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Projects
  - name: Tasks
  - name: Comments
  - name: Notifications
  - name: Team Invitations

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                token_name: { type: string, nullable: true }
            example:
              email: api-user@mopux.test
              password: password
              token_name: mobile-app
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthTokenData' }
        '401': { $ref: '#/components/responses/Error401' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout del token actual
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
        '401': { $ref: '#/components/responses/Error401' }

  /api/v1/auth/user:
    get:
      tags: [Auth]
      summary: Obtener el usuario autenticado
      responses:
        '200':
          description: Usuario recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /api/v1/tasks/my:
    get:
      tags: [Tasks]
      summary: Listado de mis tareas
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: params
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TaskSummary' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/v1/tasks:
    post:
      tags: [Tasks]
      summary: Crear tarea
      description: |
        Los campos enriquecidos (status, priority, fechas, horas, tags y
        assignees) son opcionales. Las horas se envían como HH:MM y se guardan
        como HH:MM:SS. El actor debe pertenecer al proyecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422': { $ref: '#/components/responses/Error422' }

        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/UncertainWriteResult'

  /api/v1/tasks/batch:
    patch:
      tags: [Tasks]
      summary: Actualizar varias tareas de forma atómica
      description: |
        1 a 4 tareas distintas, que pueden pertenecer a distintos proyectos del
        mismo tenant. Si alguna falla no se aplica ninguna. Para una sola tarea
        usa PATCH /api/v1/tasks/{taskId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskBatchUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422': { $ref: '#/components/responses/Error422' }

        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/UncertainWriteResult'

  /api/v1/tasks/markdown-help:
    get:
      tags: [Tasks]
      summary: Obtener ayuda de Markdown
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          guide_url: { type: string }
                          mention_hint: { type: string }
                          examples:
                            type: array
                            items:
                              type: object
                              properties:
                                input: { type: string }
                                output: { type: string }
        '401': { $ref: '#/components/responses/Error401' }

  /api/v1/tasks/focus:
    get:
      tags: [Tasks]
      summary: Mi foco
      description: Tareas fijadas en el foco personal del usuario, en su orden, y el límite de tareas.
      responses:
        '200':
          description: Foco recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks: { type: array, items: { type: object } }
                          limit: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }

  /api/v1/tasks/{taskId}/focus:
    post:
      tags: [Tasks]
      summary: Fijar una tarea en mi foco
      description: Solo tareas abiertas asignadas al usuario, hasta el límite del foco (422 si se supera o la tarea está hecha). Devuelve el foco actualizado.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Foco actualizado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
    delete:
      tags: [Tasks]
      summary: Quitar una tarea de mi foco
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Foco actualizado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/v1/tasks/{taskId}/attachments:
    get:
      tags: [Tasks]
      summary: Adjuntos de la tarea
      description: Archivos únicos adjuntos a la tarea o a sus comentarios, con un enlace de descarga firmado válido 15 minutos y los comentarios en los que aparecen. Misma consulta que la tool MCP list_task_attachments.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Adjuntos recuperados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_id: { type: integer }
                          attachments:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string, nullable: true }
                                type: { type: string, nullable: true }
                                mimetype: { type: string, nullable: true }
                                size: { type: integer }
                                url: { type: string }
                                comment_ids: { type: array, items: { type: integer } }
                                direct: { type: boolean }
                          page: { type: integer }
                          last_page: { type: integer }
                          total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/v1/tasks/{taskId}/files:
    post:
      tags: [Tasks]
      summary: Subir un documento a la tarea
      description: Sube el archivo (multipart/form-data, campo file) con las comprobaciones de cuota de almacenamiento y lo vincula a la tarea. Requiere permiso para subir archivos en la tarea. Devuelve el adjunto con su enlace firmado.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Documento subido }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/tasks/{taskId}/files/{mediaId}:
    delete:
      tags: [Tasks]
      summary: Borrar un documento de la tarea
      description: Borra el documento de la tarea y de sus comentarios, y el archivo físico si nada más lo usa. Requiere permiso para borrar archivos (propietario del archivo, o admin o gestor de proyectos miembro de los proyectos que lo usan).
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: path
          name: mediaId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Documento borrado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/v1/tasks/{taskId}/move-options:
    get:
      tags: [Tasks]
      summary: Obtener opciones para mover tarea
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          current_project_id: { type: integer }
                          current_group_id: { type: integer }
                          projects:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string }
                                groups:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id: { type: integer }
                                      title: { type: string }
                                      position: { type: integer }
                                warnings:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      code: { type: string }
                                      user_id: { type: integer }
                                      message: { type: string }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: Listado de proyectos del usuario autenticado
      parameters:
        - in: query
          name: q
          schema: { type: string, nullable: true }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaginatedProjects' }
        '401': { $ref: '#/components/responses/Error401' }
        '422': { $ref: '#/components/responses/Error422' }
    post:
      tags: [Projects]
      summary: Crear proyecto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                date_starts: { type: string, format: date, nullable: true }
                date_ends: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer }
                          title: { type: string }
                          description: { type: string, nullable: true }
                          status: { type: integer, nullable: true }
                          owner_id: { type: integer }
                          date_starts: { type: string, nullable: true }
                          date_ends: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error401' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Detalle de proyecto
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProjectDetail' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

    patch:
      tags: [Projects]
      summary: Editar la configuración del proyecto
      description: Solo cambian los campos enviados. Requiere poder gestionar el proyecto. El equipo se gestiona aparte. El estado retrasado (-1) solo se puede mantener si el proyecto ya lo tenía.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                date_starts: { type: string, format: date, nullable: true }
                date_ends: { type: string, format: date, nullable: true, description: No puede ser anterior a date_starts }
                status: { type: integer, enum: [0, 1, 2, -1], description: '0 en curso, 1 terminado, 2 archivado' }
                notify_comments: { type: boolean }
                notify_tasks: { type: boolean }
                notify_documents: { type: boolean }
      responses:
        '200':
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectDetail'
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }

    delete:
      tags: [Projects]
      summary: Eliminar el proyecto
      description: Elimina el proyecto con todos sus grupos y tareas. Requiere poder gestionar el proyecto y confirmar enviando su slug en `confirm`, como en la web.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: Slug del proyecto }
      responses:
        '200': { description: Proyecto eliminado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/projects/{projectId}/activity:
    get:
      tags: [Projects]
      summary: Consultar la actividad del proyecto
      description: Actividad del proyecto accesible para el usuario, ordenada por fecha e ID descendentes. Los filtros se combinan. La fecha hasta incluye todo el día indicado.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, task_completed, comments, documents, date_start, date_end, task_deleted]
            default: all
        - in: query
          name: type
          description: Tipo exacto del evento.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: user_id
          description: Usuario que realizó la acción.
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Debe ser igual o posterior a from.
          schema: { type: string, format: date }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Actividad recuperada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaginatedProjectActivity' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/projects/{projectId}/members:
    get:
      tags: [Projects]
      summary: Miembros del proyecto
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Miembros recuperados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          members:
                            type: array
                            items: { type: object, properties: { id: { type: integer }, name: { type: string }, avatar: { type: string, nullable: true } } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
    post:
      tags: [Projects]
      summary: Añadir un miembro al proyecto
      description: Requiere poder gestionar el proyecto. El usuario debe existir y estar activo. Devuelve el equipo actualizado.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
      responses:
        '200': { description: Miembro añadido }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/projects/{projectId}/members/{userId}:
    delete:
      tags: [Projects]
      summary: Quitar un miembro del proyecto
      description: Requiere poder gestionar el proyecto. No se puede quitar al propietario ni a uno mismo (422). Las tareas del miembro siguen en el proyecto.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Miembro quitado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/v1/projects/{projectId}/summary:
    get:
      tags: [Projects]
      summary: Resumen del proyecto
      description: Progreso, distribución de cada grupo por estado y carga de trabajo por persona, igual que la página de resumen de la web.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Resumen recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project: { type: object, properties: { id: { type: integer }, title: { type: string } } }
                          total: { type: integer }
                          completed: { type: integer }
                          pending: { type: integer }
                          progress: { type: integer, description: Porcentaje de tareas hechas }
                          groups:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string }
                                status: { type: integer }
                                total: { type: integer }
                                progress: { type: integer }
                                counts:
                                  type: object
                                  properties:
                                    pending: { type: integer }
                                    doing: { type: integer }
                                    revision: { type: integer }
                                    done: { type: integer }
                                    delayed: { type: integer }
                          people:
                            type: array
                            items:
                              type: object
                              properties:
                                user: { type: object, properties: { id: { type: integer }, name: { type: string }, avatar: { type: string, nullable: true } } }
                                total: { type: integer }
                                pending: { type: integer }
                                completed: { type: integer }
                          unassigned: { type: object, properties: { total: { type: integer }, pending: { type: integer }, completed: { type: integer } } }
                          without_tasks: { type: integer, description: Miembros sin tareas asignadas }
                          multiple_assignees: { type: boolean }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
