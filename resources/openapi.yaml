openapi: 3.1.0
info:
  title: Mopux Public API v1
  version: 1.1.2
  license:
    name: Propietaria. Uso sujeto a las condiciones de Mopux
    url: https://mopux.com/es/legal/terms
  description: |
    Versión pública y simplificada de la API v1 de Mopux.

    Reglas generales:
    - Base path: `/api/v1`
    - Auth: Bearer token (Sanctum u OAuth cuando está habilitado)
    - OAuth requiere mopux:read para lecturas y mopux:write para escrituras (logout no requiere scope).
    - Errores: `{success: false, message, data: {error, errors?}}`; en 422 los mensajes por campo van en `data.errors.{campo}`. El 429 y el 403 por bloqueo de facturación devuelven solo `{message}` o `{success, message}`, sin `data`.
    - Límite de peticiones: 30/min en `auth/login` y 120/min en el resto; al superarlo responde 429 con `Retry-After` (segundos).
    - En `multipart/form-data`, los arrays van con una parte por elemento y nombre con corchetes: `files[]`, `mentions[]`, `media_ids[]`.
    - Paginación: Laravel `data/links/meta` (proyectos, actividad, invitaciones), campos de página en el objeto (`team`, adjuntos) o listas sin metadatos (comentarios, notificaciones). `tasks/my` no está paginado. Las páginas se piden con `page`.
    - Los borrados sin datos que devolver responden `data: []`.

    Resultado incierto y reintentos:
    - Las operaciones enriquecidas (`POST /api/v1/tasks`, `PATCH /api/v1/tasks/{taskId}`, `PATCH /api/v1/tasks/batch`, `POST /api/v1/projects/{projectId}/task-groups` con `tasks`) son atómicas: 404 recurso ausente, 403/422 inválido; ante esos errores conocidos no se aplica nada.
    - Ante un 500 inesperado el resultado es incierto: no se garantiza que no se haya escrito. No reintentes automáticamente una creación; refresca el estado antes de decidir. No hay idempotencia persistida para crear tareas.
    - Las horas se envían como `HH:MM` y se devuelven como `HH:MM:SS`; `null` borra descripción, fechas u horas; `assignees` es `{operation, user_ids}`; `status` `-1` es de solo lectura.
servers:
  - url: https://{tenant_domain}
    description: Dominio de tu instalación de Mopux
    variables:
      tenant_domain:
        default: acme.mopux.com

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login con email y contraseña, logout y usuario del token.
  - name: Projects
    description: Proyectos, su board, actividad, resumen y miembros, y los grupos de tareas.
  - name: Tasks
    description: Tareas, sus campos, foco personal, documentos y toques.
  - name: Comments
    description: Comentarios y respuestas de las tareas, con menciones y adjuntos.
  - name: Notifications
    description: Notificaciones del usuario autenticado.
  - name: Touches
    description: Toques recibidos y enviados entre miembros de un proyecto.
  - name: Team
    description: Personas de la instalación.
  - name: Team Invitations
    description: Invitaciones para unirse al equipo.


paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      security: []
      summary: Login y emisión de token
      description: Devuelve un token personal (`id|secret`) que solo se muestra una vez. Credenciales incorrectas devuelven 401 (`Unauthorised.`); un usuario sin el permiso de uso de la API devuelve 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                token_name:
                  type: [string, 'null']
                  maxLength: 255
                  default: mobile-app
            examples:
              basic:
                value:
                  email: api-user@mopux.test
                  password: password
                  token_name: mobile-app
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenData'
              examples:
                ok:
                  $ref: '#/components/examples/LoginSuccess'
        '401':
          $ref: '#/components/responses/Error401'
        '403': { $ref: '#/components/responses/Error403' }
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Logout del token actual
      responses:
        '200':
          description: Logout correcto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 0
        '401':
          $ref: '#/components/responses/Error401'
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/auth/user:
    get:
      operationId: authUser
      tags: [Auth]
      summary: Obtener el usuario autenticado
      responses:
        '200':
          description: Usuario recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/my:
    get:
      operationId: tasksMy
      tags: [Tasks]
      summary: Listado de mis tareas
      description: Tareas abiertas asignadas al usuario en todos sus proyectos, más las terminadas en los últimos 15 días. No está paginado. Requiere permiso para ver proyectos.
      parameters:
        - in: query
          name: search
          description: Texto a buscar en el título.
          schema:
            type: string
            maxLength: 255
        - in: query
          name: params
          description: 'Filtros adicionales. Solo se usa `projects` (IDs de proyecto). Se envía como array en la query (`params[projects][]=12`) o como JSON serializado (`params={"projects":[12]}`).'
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              projects:
                type: array
                items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Tareas recuperadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaskSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks:
    post:
      operationId: tasksCreate
      tags: [Tasks]
      summary: Crear tarea
      description: |
        Crea una tarea. Los campos enriquecidos (status, priority, date_start,
        date_end, hours_expected, hours_inverted, tags y assignees) son
        opcionales y, si se omiten, se conservan los valores por defecto
        heredados (pending, prioridad baja, sin fechas, sin horas, sin
        etiquetas y sin responsables). Las horas se envían como HH:MM (00-99
        horas, 00-59 minutos) y se almacenan como HH:MM:SS. El actor debe
        pertenecer al proyecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
      responses:
        '200':
          description: Tarea creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TaskDetail' }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

        '404':
          $ref: '#/components/responses/Error404'
        '429': { $ref: '#/components/responses/Error429' }
        '500':
          $ref: '#/components/responses/UncertainWriteResult'

  /api/v1/tasks/batch:
    patch:
      operationId: tasksUpdateBatch
      tags: [Tasks]
      summary: Actualizar varias tareas de forma atómica
      description: |
        Aplica cambios a entre 1 y 4 tareas distintas en una sola operación
        atómica. Las tareas pueden pertenecer a proyectos distintos del mismo
        tenant, siempre que el actor sea miembro de todos ellos. Si cualquier
        tarea no existe, no es accesible o entra en conflicto, no se aplica
        ningún cambio. Para una sola tarea usa PATCH /api/v1/tasks/{taskId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskBatchUpdateInput'
      responses:
        '200':
          description: Tareas actualizadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items: { $ref: '#/components/schemas/TaskDetail' }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

        '404':
          $ref: '#/components/responses/Error404'
        '429': { $ref: '#/components/responses/Error429' }
        '500':
          $ref: '#/components/responses/UncertainWriteResult'

  /api/v1/tasks/markdown-help:
    get:
      operationId: tasksMarkdownHelp
      tags: [Tasks]
      summary: Obtener ayuda de formato Markdown para comentarios y descripción
      responses:
        '200':
          description: Ayuda markdown recuperada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          guide_url: { type: string }
                          mention_hint: { type: string }
                          examples:
                            type: array
                            items:
                              type: object
                              properties:
                                input: { type: string }
                                output: { type: string }
        '401':
          $ref: '#/components/responses/Error401'
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/focus:
    get:
      operationId: tasksFocus
      tags: [Tasks]
      summary: Mi foco
      description: Tareas fijadas en el foco personal del usuario, en su orden, y el límite de tareas.
      responses:
        '200':
          description: Foco recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FocusList'
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/{taskId}/focus:
    post:
      operationId: tasksPinFocus
      tags: [Tasks]
      summary: Fijar una tarea en mi foco
      description: Solo tareas abiertas asignadas al usuario, hasta el límite del foco (422 si se supera o la tarea está hecha). Devuelve el foco actualizado.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Foco actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FocusList'
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }
    delete:
      operationId: tasksUnpinFocus
      tags: [Tasks]
      summary: Quitar una tarea de mi foco
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Foco actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FocusList'
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/{taskId}/attachments:
    get:
      operationId: tasksAttachments
      tags: [Tasks]
      summary: Adjuntos de la tarea
      description: Archivos únicos adjuntos a la tarea o a sus comentarios, con un enlace de descarga firmado válido 15 minutos y los comentarios en los que aparecen.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Adjuntos recuperados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_id: { type: integer }
                          attachments:
                            type: array
                            items:
                              $ref: '#/components/schemas/Attachment'
                          page: { type: integer }
                          last_page: { type: integer }
                          total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/{taskId}/files:
    post:
      operationId: tasksUploadFile
      tags: [Tasks]
      summary: Subir un documento a la tarea
      description: Sube el archivo (multipart/form-data, campo file) con las comprobaciones de cuota de almacenamiento y lo vincula a la tarea. Requiere permiso para subir archivos en la tarea. Devuelve el adjunto con su enlace firmado.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Documento subido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Attachment'
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/{taskId}/files/{mediaId}:
    delete:
      operationId: tasksDeleteFile
      tags: [Tasks]
      summary: Borrar un documento de la tarea
      description: Borra el documento de la tarea y de sus comentarios, y el archivo físico si nada más lo usa. Requiere permiso para borrar archivos (propietario del archivo, o admin o gestor de proyectos miembro de los proyectos que lo usan). Si el documento no pertenece a la tarea responde 403.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: path
          name: mediaId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Documento borrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { type: array, maxItems: 0 }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/tasks/{taskId}/move-options:
    get:
      operationId: tasksMoveOptions
      tags: [Tasks]
      summary: Obtener opciones para mover una tarea
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Opciones de movimiento recuperadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          current_project_id: { type: integer }
                          current_group_id: { type: integer }
                          projects:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string }
                                groups:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id: { type: integer }
                                      title: { type: string }
                                      position: { type: integer }
                                warnings:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      code: { type: string }
                                      user_id: { type: integer }
                                      message: { type: string }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects:
    get:
      operationId: projectsList
      tags: [Projects]
      summary: Listado de proyectos del usuario autenticado
      description: Proyectos visibles para el usuario, ordenados por título. Requiere permiso para ver proyectos.
      parameters:
        - in: query
          name: q
          description: Texto a buscar en el título y la descripción.
          schema:
            type: [string, 'null']
            maxLength: 255
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Proyectos recuperados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedProjects'
        '401':
          $ref: '#/components/responses/Error401'
        '403': { $ref: '#/components/responses/Error403' }
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }
    post:
      operationId: projectsCreate
      tags: [Projects]
      summary: Crear proyecto
      description: Requiere permiso para gestionar proyectos. A diferencia del resto de respuestas de proyecto, las fechas se devuelven como `Y-m-d`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: [string, 'null'] }
                date_starts: { type: [string, 'null'], format: date }
                date_ends: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Proyecto creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer }
                          title: { type: string }
                          description: { type: [string, 'null'] }
                          status: { $ref: '#/components/schemas/ProjectStatus' }
                          owner_id: { type: integer }
                          date_starts: { type: [string, 'null'], format: date }
                          date_ends: { type: [string, 'null'], format: date }
        '401':
          $ref: '#/components/responses/Error401'
        '403': { $ref: '#/components/responses/Error403' }
        '422':
          $ref: '#/components/responses/Error422'
        '429': { $ref: '#/components/responses/Error429' }

  /api/v1/projects/{projectId}:
    get:
      operationId: projectsShow
      tags: [Projects]
      summary: Detalle de proyecto
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Proyecto recuperado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429': { $ref: '#/components/responses/Error429' }

    patch:
      operationId: projectsUpdate
      tags: [Projects]
      summary: Editar la configuración del proyecto
      description: Solo cambian los campos enviados; un cuerpo sin ningún campo editable devuelve 422 (`errors.project`). Requiere poder gestionar el proyecto. El equipo se gestiona aparte. El estado retrasado (-1) solo se puede mantener si el proyecto ya lo tenía.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: [string, 'null'] }
                date_starts: { type: [string, 'null'], format: date }
                date_ends: { type: [string, 'null'], format: date, description: No puede ser anterior a date_starts }
                status: { $ref: '#/components/schemas/ProjectStatus' }
                notify_comments: { type: boolean }
                notify_tasks: { type: boolean }
                notify_documents: { type: boolean }
      responses:
        '200':
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectDetail'
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '422': { $ref: '#/components/responses/Error422' }
        '429': { $ref: '#/components/responses/Error429' }

    delete:
      operationId: projectsDelete
      tags: [Projects]
      summary: Eliminar el proyecto
      description: Elimina el proyecto con todos sus grupos y tareas. Requiere poder gestionar el proyecto y confirmar enviando su slug en `confirm`, como en la web.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: Slug del proyecto }
      responses:
        '200':
          description: Proyecto eliminado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { type: array, maxItems: 0 }
