        - $ref: '#/components/parameters/projectId'
        - in: path
          name: taskGroupId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  minItems: 1
                  description: Sin IDs repetidos (422 si se repite alguno o no pertenece al grupo).
                  items:
                    type: object
                    required: [value, order]
                    properties:
                      value:
                        type: integer
                        description: ID de task
                      order:
                        type: integer
                        minimum: 0
            examples:
              reorder:
                value:
                  tasks:
                    - value: 100
                      order: 1
                    - value: 101
                      order: 0
      responses:
        '200':
          description: Tareas reordenadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                title: { type: string }
                                group_position: { type: integer }
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
